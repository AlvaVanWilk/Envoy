<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Envoy">
  <meta name="description" content="Gesunde Alltagsroutine als Rollenspiel.">
  <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/app/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/cinzel-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/envoy.css">
  <title>Envoy</title>
</head>
<body>
  <!-- Colours shared by the shields in the menu and the resource pictures. -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sh-rim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#eef2f5"/><stop offset="0.28" stop-color="#9ea7af"/>
        <stop offset="0.62" stop-color="#555d66"/><stop offset="1" stop-color="#23272c"/>
      </linearGradient>
      <linearGradient id="sh-face" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="#58616a"/><stop offset="0.5" stop-color="#323940"/><stop offset="1" stop-color="#191c20"/>
      </linearGradient>
      <linearGradient id="sh-face-active" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="#f0f3f5"/><stop offset="0.5" stop-color="#aeb8c1"/><stop offset="1" stop-color="#6b757f"/>
      </linearGradient>
      <linearGradient id="sh-face-locked" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="#3b3d40"/><stop offset="0.6" stop-color="#28292c"/><stop offset="1" stop-color="#1b1c1e"/>
      </linearGradient>
      <linearGradient id="sh-sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0.28" stop-color="#fff" stop-opacity="0"/><stop offset="0.42" stop-color="#fff" stop-opacity="0.2"/>
        <stop offset="0.54" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="g-aether" cx="0.5" cy="0.7" r="0.62">
        <stop offset="0" stop-color="#f3fdfd"/><stop offset="0.45" stop-color="#a6d2d5"/><stop offset="1" stop-color="#4f7f86"/>
      </radialGradient>
      <linearGradient id="g-quarz" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f4f8f9"/><stop offset="0.55" stop-color="#cdd7dc"/><stop offset="1" stop-color="#9aabb5"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="backdrop" aria-hidden="true"></div>
  <nav id="nav" class="dock" aria-label="Hauptmenü"></nav>
  <main id="view" class="main">
    <div class="loading" aria-live="polite"><span class="loading-sigil"></span></div>
  </main>
  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
