# Läuft bei jeder Änderung im Repository:
#   1. Tabellen aus data/ umwandeln und die JSON-Dateien mit ablegen
#   2. Spielregeln testen
#   3. per SFTP auf den IONOS-Webspace laden:
#      - der Arbeitszweig in den Testordner (Name des echten Ordners mit „-test“,
#        zum Beispiel /envoy-test). Diese Fassung heißt „Envoy Test“, trägt ein
#        kleines Test-Schild und speichert getrennt von der echten App;
#      - der Zweig main in den echten Ordner. Auf main kommt nur, was die
#        Nutzerin im Testordner angesehen und freigegeben hat.
#
# Für Schritt 3 braucht es einmalig vier Geheimnisse unter
# Settings → Secrets and variables → Actions (siehe README):
#   IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD, IONOS_SFTP_PATH
# Fehlen sie, wird Schritt 3 übersprungen.

name: Prüfen und hochladen

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: envoy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen-und-hochladen:
    runs-on: ubuntu-latest
    env:
      IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
      IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
      IONOS_SFTP_PATH: ${{ secrets.IONOS_SFTP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tabellen umwandeln
        run: python3 tools/convert_data.py

      - name: Spielregeln testen
        run: npm test

      - name: Umgewandelte Daten übernehmen
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- data/*.json; then
            echo "Daten unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Daten aus den Tabellen umgewandelt"
          git push

      - name: Auf den Webspace laden
        if: github.event_name != 'pull_request'
        env:
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          fehlt=0
          for name in IONOS_SFTP_HOST IONOS_SFTP_USER IONOS_SFTP_PATH LFTP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Fehlt: ${name/LFTP_PASSWORD/IONOS_SFTP_PASSWORD}"; fehlt=1; fi
          done
          if [ "$fehlt" = 1 ]; then echo "Nicht hochgeladen: Es fehlen Geheimnisse (siehe README)."; exit 0; fi

          ordner="${IONOS_SFTP_PATH%/}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Ziel: der echte Ordner."
          else
            ordner="${ordner:-/envoy}-test"
            # Als Testfassung kennzeichnen: eigener Speicher, eigener Name.
            sed -i "s/export const STAGE = 'live';/export const STAGE = 'test';/" js/stage.js
            sed -i 's/"name": "Envoy"/"name": "Envoy Test"/; s/"short_name": "Envoy"/"short_name": "Envoy Test"/' manifest.webmanifest
            sed -i 's/name="apple-mobile-web-app-title" content="Envoy"/name="apple-mobile-web-app-title" content="Envoy Test"/' index.html
            grep -q "STAGE = 'test'" js/stage.js || { echo "Die Testfassung ließ sich nicht kennzeichnen."; exit 1; }
            echo "Ziel: der Testordner (echter Ordner mit -test)."
          fi

          sudo apt-get install -y -qq lftp > /dev/null
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$IONOS_SFTP_USER\" sftp://$IONOS_SFTP_HOST;
            mkdir -p -f \"$ordner\";
            mirror --reverse --parallel=4 \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob tools/ \
              --exclude-glob tests/ \
              --exclude-glob docs/ \
              --exclude-glob node_modules/ \
              --exclude-glob sync-daten/ \
              --exclude-glob '*.md' \
              --exclude-glob '*.xlsx' \
              --exclude-glob package.json \
              ./ \"$ordner\"
          "
          echo "Hochgeladen."
