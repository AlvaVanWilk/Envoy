# Prüft bei jeder Änderung die Spielregeln (Tests) und die Tabellen.
# Wurde eine Tabelle in data/ geändert, legt der Lauf die daraus erzeugten
# JSON-Dateien automatisch mit ins Repository. So geht die Umwandlung auch
# ohne Python auf dem eigenen Gerät.

name: Prüfen und Daten umwandeln

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Spielregeln testen
        run: npm test

      - name: Tabellen umwandeln
        run: python3 tools/convert_data.py

      - name: Umgewandelte Daten übernehmen
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- data/uebungen.json data/ausruestung.json; then
            echo "Daten unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uebungen.json data/ausruestung.json
          git commit -m "Daten aus den Tabellen umgewandelt"
          git push
